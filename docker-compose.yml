# Локальный стек (запуск на своей машине). Прод-стек на сервере — docker-compose.prod.yml.
# Поднимает Postgres + бэкенд (с миграциями) + фронт (web/) + сидер (админ и товары).
#
#   docker compose up --build
#
# Значения берутся из .env (см. .env.example), но у всех есть дефолты — можно
# запускать и без .env. Дефолты: Веб http://localhost:8088 (admin / admin123),
# API http://localhost:8001, Postgres localhost:5433 (app_user / app_pass / appdb).
# Секретов не нужно — APP_ENV=development отключает прод-валидацию.
name: nufnaf-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - nufnaf_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: nufnaf-dev-backend:latest
    environment:
      APP_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-secret-change-me}
      FIRST_ADMIN_PASS: ${FIRST_ADMIN_PASS:-dev-first-admin-pass}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:8080"
    # default — чтобы видеть свой backend; shared — чтобы nginx достучался до
    # бэкенда прайса (алиас price-backend в стеке nn_price). Сеть внешняя:
    #   docker network create nufnaf_shared
    networks:
      - default
      - shared

  seed:
    image: nufnaf-dev-backend:latest
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    environment:
      APP_ENV: development
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - ./ops/dev_seed.py:/seed.py:ro
    command: ["python", "/seed.py"]
    restart: "no"

volumes:
  nufnaf_dev_pg:

networks:
  default:
  # Общая сеть с локальным стеком прайса (nn_price). Создать заранее:
  #   docker network create nufnaf_shared
  shared:
    external: true
    name: nufnaf_shared
