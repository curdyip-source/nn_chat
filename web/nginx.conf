server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    resolver 127.0.0.11 ipv6=off valid=30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Хэшированные ассеты Vite можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html НЕ кэшируем: иначе после деплоя вкладка SPA продолжает крутить
    # старый бандл и тянет устаревшие хэши ассетов. add_header в location заменяет
    # унаследованные, поэтому security-заголовки переобъявляем здесь.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE: realtime chat stream. Long-lived connection that must not be buffered
    # (otherwise events arrive in clumps) and needs a long read timeout. Exact-match
    # location wins over the /api/ prefix below regardless of order.
    location = /api/v1/messages/stream {
        set $backend_stream http://backend:8000;
        proxy_pass $backend_stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        set $backend_api http://backend:8000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /media/ {
        set $backend_media http://backend:8000;
        proxy_pass $backend_media;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Прайс (nn_vla) — отдельный бэкенд+БД, доступен по сети-алиасу price-backend
    # (общий docker-network с этим стеком). Префикс /price-api срезаем:
    # /price-api/api/... -> бэкенд прайса /api/... Переменная в proxy_pass +
    # resolver: nginx стартует, даже если апстрим временно недоступен.
    location /price-api/ {
        set $price_backend http://price-backend:8000;
        rewrite ^/price-api/(.*)$ /$1 break;
        proxy_pass $price_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
