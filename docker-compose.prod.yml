name: nufnaf

services:
  db:
    image: ${POSTGRES_IMAGE:-ghcr.io/curdyip-source/nn_chat-postgres:17-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE}:${RELEASE_TAG}
    pull_policy: always
    container_name: nufnaf_backend
    restart: unless-stopped
    init: true
    user: "app"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${APNS_AUTH_KEY_P8}
        target: /run/secrets/apns/AuthKey.p8
        read_only: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
      APP_ENV: ${APP_ENV}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      INSECURE_ALLOW_HTTP_ORIGINS: ${INSECURE_ALLOW_HTTP_ORIGINS:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      PROFILE_PHOTO_MAX_BYTES: ${PROFILE_PHOTO_MAX_BYTES}
      APNS_AUTH_KEY_P8: /run/secrets/apns/AuthKey.p8
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_TOPIC: ${APNS_TOPIC}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX}
      FIRST_ADMIN_PASS: ${FIRST_ADMIN_PASS}
      # СДЭК: боевой API по умолчанию; ключи из договора, вебхук для авто-статусов.
      CDEK_BASE_URL: ${CDEK_BASE_URL:-https://api.cdek.ru/v2}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT}
      CDEK_SECURE: ${CDEK_SECURE}
      CDEK_WEBHOOK_URL: ${CDEK_WEBHOOK_URL}
      CDEK_SENDER_CITY_CODE: ${CDEK_SENDER_CITY_CODE:-44}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    # default — своя БД; shared — бэкенд прайса nn_vla (алиас price-backend) для
    # федерации каталога товаров (свежий CL как источник правды).
    networks:
      - default
      - shared

  frontend:
    image: ${FRONTEND_IMAGE}:${RELEASE_TAG}
    pull_policy: always
    container_name: nufnaf_frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/_healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /var/lib/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    # default — свой backend; shared — бэкенд прайса (алиас price-backend, стек nn_vla).
    # Сеть внешняя, создать заранее на сервере: docker network create nufnaf_shared
    networks:
      - default
      - shared

volumes:
  postgres_data:

networks:
  default:
  shared:
    external: true
    name: nufnaf_shared